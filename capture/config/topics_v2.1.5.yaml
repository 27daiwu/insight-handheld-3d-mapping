# Topic profile for Insight 9, firmware / software 2.1.5 (project device baseline since 2026-11-26).
# Derived from topics_v2.1.4.yaml (kept unchanged as history) and calibrated against a REAL device:
#   Insight 9, fw 2.1.5, ROS_DOMAIN_ID 9, prefix /camera/camera, observed from WSL2 (Humble, Fast DDS).
#   Evidence: reports/camera_data/topics_domain9.txt, probe_60s_run1.json, real5min_*.json,
#             reports/depth_loss/runs/*, reports/camera_param_experiment/*.
#
# VERIFICATION POLICY (no bulk changes):
#   file-level `verified` stays false until EVERY required role is verified AND a native-Ubuntu run exists.
#   role-level `verification.verified: true` only if, on fw 2.1.5, in >= 2 independent runs:
#     name+type+frame_id observed, header stamps monotonic, measured rate == nominal, loss <= 0.1 % (header-stamp space).
#   Every role lists its evidence and what is still pending. Change one role at a time, with a changelog entry.
profile: insight9-v2.1.5
verified: false
firmware_baseline: "2.1.5"
ros_domain_id_observed: 9
default_prefix_observed: /camera/camera

image_types: &image_types
  - sensor_msgs/msg/Image
  - sensor_msgs/msg/CompressedImage

roles:
  rgb:
    kind: image
    verification:
      verified: true
      evidence: 'color/image_rect_raw/compressed jpeg 1088x1920, 30.019 Hz, 0 stamp gaps in 340 s, loss 0.00-0.01% in 6 runs'
      pending:
        - 'color/image_raw/compressed has a publisher but 0 msgs (unused)'
        - 'JPEG only - no raw RGB topic exists on 2.1.5'
        - 'colour space/range of JPEG unconfirmed'
    required: true
    types: *image_types
    suffix: '/(rgb|color)/image[^/]*(/compressed)?'
  stereo_left:
    kind: image
    verification:
      verified: true
      evidence: 'infra1/image_rect_raw mono8 544x640 30.000 Hz; pooled loss ~0.02% (0.11% in one 90 s run with depth on, 0 in depth-off run)'
      pending:
        - 'rectified vs raw semantics (infra1/image_raw empty)'
        - 'HDR on at 30 fps (vendor option) - effect on exposure not characterised'
    required: true
    types: *image_types
    suffix: '/(stereo/)?(left|stereo_left|infra1)(_camera)?/image[^/]*(/compressed)?'
  stereo_right:
    kind: image
    verification:
      verified: true
      evidence: 'infra2/image_rect_raw mono8 544x640 30.000 Hz; L/R stamps identical (skew 0 ms, 100% matched); pooled loss ~0.03%'
      pending:
        - 'rectified vs raw semantics'
    required: true
    types: *image_types
    suffix: '/(stereo/)?(right|stereo_right|infra2)(_camera)?/image[^/]*(/compressed)?'
  depth:
    kind: image
    verification:
      verified: false
      evidence: 'depth/image_rect_raw mono16 544x640, frame camera_camera_depth, aligned to left-stereo stamps; mean rate 13.0-13.2 Hz vs 15 Hz nominal => 11.8-13.1% missing in EVERY run'
      pending:
        - '12-13% shortfall is camera-side (reports/3_depth_loss_root_cause.md): vendor to confirm intended rate'
        - 'unit of mono16 values unconfirmed (mm assumed from vendor doc; median 542)'
        - 'value 65535 / 0 meaning (invalid) unconfirmed'
    required: false          # earlier belief: depth default OFF; on the tested unit it was ON (/api/deep-flow enabled=true)
    default_off: true
    types: *image_types
    suffix: '/depth/image[^/]*(/compressed|/compressedDepth)?'
  imu:
    kind: imu
    verification:
      verified: true
      evidence: 'imu 400.0 Hz, frame camera_camera_imu_optical, |a|=9.78 m/s2 at rest (so m/s2); pooled loss ~0.05% (0.12% in the 340 s run, 0 with depth off)'
      pending:
        - 'axes/gravity sign vs camera_camera_imu_optical (tf says identity to left) unconfirmed'
        - 'covariances all 0 (unknown), orientation identity (not estimated)'
        - 'BEST_EFFORT history depth 1 on the camera'
    required: true
    types: [sensor_msgs/msg/Imu]
    suffix: '/imu(/data)?(_raw)?'
  vio:
    kind: vio
    verification:
      verified: false
      evidence: "vio_100hz PoseStamped frame 'world', 100 Hz grid (median 10 ms); delivered 99.944 / 99.900 Hz in 2 runs = count loss 0.056 / 0.100 % vs 100 Hz; the gap-based estimate (0.29 / 0.38 %) over-counts because VIO stamps are jittery (2.5-27.5 ms). NOT verified: the nominal rate is known only from the topic name, the vendor guides list a different topic and rate (v1.2.0 30 Hz, v1.2.1 15 Hz), pose semantics pending"
      pending:
        - 'pose semantics (T_world_imu per vendor doc) unconfirmed'
        - "'world' frame has no TF link to the camera tree"
        - 'vendor guides: /insight/vio_pose at 30 Hz (v1.2.0) or 15 Hz (v1.2.1) - no such topic on 2.1.5; vio_image (30 Hz PoseStamped) is a candidate equivalent, UNCONFIRMED'
        - 'vio_status stays TRACKING_STATIC when stationary; behaviour in motion untested'
    required: true
    types:
      - nav_msgs/msg/Odometry
      - geometry_msgs/msg/PoseStamped
      - geometry_msgs/msg/PoseWithCovarianceStamped
    any_prefix: true         # vendor doc puts VIO under /insight/*, camera under /camera/*
    suffix: '/(vio|vio_pose|vio_100hz|odom|odometry|pose)(/[^/]+)?'
  rgb_info:
    kind: camera_info
    verification:
      verified: true
      evidence: 'color/camera_info 1088x1920, K fx=768.9, plumb_bob D=0, 30 Hz, frame matches image'
      pending:
        - 'D = 0 although distortion_model plumb_bob (rectified images assumed)'
    required: true
    types: [sensor_msgs/msg/CameraInfo]
    suffix: '/(rgb|color)/camera_info'
    for: rgb
  stereo_left_info:
    kind: camera_info
    verification:
      verified: true
      evidence: 'infra1/camera_info 544x640 fx=307.385 cx=269.4 cy=323.5, 30 Hz'
      pending:
        - 'D=0 (rectified assumed)'
    required: true
    types: [sensor_msgs/msg/CameraInfo]
    suffix: '/(stereo/)?(left|stereo_left|infra1)(_camera)?/camera_info'
    for: stereo_left
  stereo_right_info:
    kind: camera_info
    verification:
      verified: true
      evidence: 'infra2/camera_info same K, P[3]=-30.776 => baseline 0.10012 m (matches tf_static)'
      pending:
        - 'D=0 (rectified assumed)'
    required: true
    types: [sensor_msgs/msg/CameraInfo]
    suffix: '/(stereo/)?(right|stereo_right|infra2)(_camera)?/camera_info'
    for: stereo_right
  depth_info:
    kind: camera_info
    verification:
      verified: false
      evidence: 'NO depth/camera_info topic exists on 2.1.5 (18 topics listed)'
      pending:
        - 'depth intrinsics presumably = infra1 (depth frame is identity from left in tf_static) - unconfirmed'
    required: false
    types: [sensor_msgs/msg/CameraInfo]
    suffix: '/depth/camera_info'
    for: depth

# Global (un-prefixed) topics.
global_topics:
  tf:        {name: /tf,        type: tf2_msgs/msg/TFMessage, required: false,   # ABSENT on fw 2.1.5 (never published in any run)
              verification: {verified: false, evidence: 'not published by the device in any run', pending: ['confirm absence is by design']}}
  tf_static: {name: /tf_static, type: tf2_msgs/msg/TFMessage, required: true,
              verification: {verified: false, evidence: '5 static edges rooted at camera_camera_left, identical in every run; baseline 0.10012 m consistent with CameraInfo',
                             pending: ['extrinsic values not validated against calibration', 'camera_camera_imu_optical is identity from left: IMU axes unconfirmed', 'frame world (VIO) not connected']}}

# Optional topics under the camera prefix recorded with --include-extra.
extra_types:
  - sensor_msgs/msg/Image
  - sensor_msgs/msg/CompressedImage
  - sensor_msgs/msg/CameraInfo
  - sensor_msgs/msg/Imu
  - nav_msgs/msg/Odometry
  - geometry_msgs/msg/PoseStamped
  - geometry_msgs/msg/PoseWithCovarianceStamped
  - std_msgs/msg/String
  - diagnostic_msgs/msg/DiagnosticArray
  - tf2_msgs/msg/TFMessage

# Sanity limits used by preflight/inspect.
thresholds:
  gap_factor: 1.5          # stamp gap > factor * median period counts as a drop
  min_rate_ratio: 0.9      # measured / nominal rate below this => WARN
  max_clock_offset_s: 1.0  # |receive time - header stamp| above this => WARN
  min_free_gb: 5.0         # refuse/stop recording below this free space
  max_loss_ratio: 0.001    # diagnostics: tolerated loss vs reference rate (0.1 %)

# Extra topics observed on fw 2.1.5 (recorded with --include-extra; NOT verified roles):
#   vio_image (PoseStamped 30 Hz, follows the image rate: 20 Hz when stereo=20 fps), vio_image_cov (PoseWithCovarianceStamped 30 Hz),
#   vio_status (std_msgs/String 1 Hz, TRANSIENT_LOCAL, constant stamps), */image_raw and color/image_raw/compressed (publisher, 0 messages).

# =====================================================================================================
# spec: unified OFFICIAL-vs-MEASURED data description (added 2026-11-27, DATA_CONTRACT v0.3).
# Single source of truth for the tables in DATA_CONTRACT.md (rendered by tools/render_contract_tables.py and
# checked by tests/test_contract_consistency.py).
#
# Per-field status:  V = verified on fw 2.1.5 by measurement in >= 2 independent runs
#                    O = observed once / one source / consistent but not cross-checked
#                    ? = pending - includes EVERY claim that rests on vendor documentation only
#                    - = not applicable
# RULE: a vendor-document statement (sources D0/D1) can never by itself give V or O. A field is V/O only if
#       its sources contain at least one measurement code (M*, TL, MF, JPEG, API, QOS).
# "measured rate" = DELIVERED mean rate (n-1)/(last-first header stamp), NOT the median-period rate.
# "loss" = count deficit vs the nominal rate = 1 - n/expected (header-stamp space). The gap-based estimate
#         (est_missing_msgs) is a different, diagnostic number and over-counts jittery stamps (VIO).
# =====================================================================================================
spec:
  schema: 1
  document: DATA_CONTRACT.md v0.3
  runs:
    A: {id: 20261126_143635_real5min,      raw: reports/camera_data/real5min_inspect.json,      started: '2026-11-26 14:36', duration_s: 340.6, note: 'WSL2 wall clock was stepping at that time (receive-time artefact only; header-stamp numbers unaffected)'}
    B: {id: 20261126_184839_real5min_v215, raw: reports/camera_data/real5min_v215_inspect.json, started: '2026-11-26 18:48', duration_s: 320.2, note: 'healthy WSL2 clock'}
  sources:
    D0:  {path: reports/vendor_docs/looper_insight9_quickstart_v1.2.0.html, kind: vendor_document, what: 'Looper Quick Start & Developer Guide v1.2.0 (topic namespace /insight/*)'}
    D1:  {path: reports/vendor_docs/looper_insight9_quickstart_v1.2.1.html, kind: vendor_document, what: 'same guide v1.2.1 (RealSense-compatible names /camera/camera/*)'}
    M1:  {path: reports/camera_data/real5min_inspect.json,       kind: measurement, what: 'run A inspect output (counts, stamp rates, diagnostics)'}
    M2:  {path: reports/camera_data/real5min_v215_inspect.json,  kind: measurement, what: 'run B inspect output'}
    TL:  {path: reports/camera_data/topics_domain9.txt,          kind: measurement, what: 'ros2 topic list -t on domain 9 (18 topics)'}
    MF:  {path: reports/contract_evidence/real_fw215_message_facts.json, kind: measurement, what: 'decoded message fields from the recorded bag (CameraInfo, TF, Image encodings, depth values)'}
    JPEG: {path: reports/contract_evidence/jpeg_sof_check.json,  kind: measurement, what: 'JPEG SOF0 decode of RGB frames'}
    API: {path: reports/camera_data/stereo-format.json,          kind: measurement, what: 'camera web API GET (stereo-format, camera-format, deep-flow, ...) in reports/camera_data/*.json'}
    QOS: {path: reports/depth_loss/camera_writer_qos.txt,        kind: measurement, what: 'camera DDS writer QoS via Cyclone discovery'}
  roles:
    rgb:
      official_v1_2_0: {topic: /insight/camera_rgb/compressed, type: sensor_msgs/msg/CompressedImage, resolution: 1920x1088, encoding: jpeg, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/camera/color/image_rect_raw/compressed, type: sensor_msgs/msg/CompressedImage, resolution: 1920x1088, encoding: jpeg, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/color/image_rect_raw/compressed, type: sensor_msgs/msg/CompressedImage, resolution_wxh: 1088x1920, encoding: jpeg, nominal_hz: 30, unit: null, frame_id: camera_camera_rgb,
                 mean_rate_hz: {A: 30.019, B: 30.019}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: V, nominal: V, rate: V, unit: '-'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [JPEG, MF, API], encoding: [JPEG, MF], nominal: [API, M1, M2, D0, D1], rate: [M1, M2], unit: []}
      deviations: [DEV-NAMESPACE, DEV-RES-ORDER]
    stereo_left:
      official_v1_2_0: {topic: /insight/camera_left_rectified, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono8, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/camera/infra1/image_rect_raw, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono8, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/infra1/image_rect_raw, type: sensor_msgs/msg/Image, resolution_wxh: 544x640, encoding: mono8, nominal_hz: 30, unit: null, frame_id: camera_camera_left,
                 mean_rate_hz: {A: 30.0, B: 30.0}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: V, nominal: V, rate: V, unit: '-'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF, API], encoding: [MF], nominal: [API, M1, M2, D0, D1], rate: [M1, M2], unit: []}
      deviations: [DEV-NAMESPACE, DEV-RES-ORDER]
    stereo_right:
      official_v1_2_0: {topic: /insight/camera_right_rectified, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono8, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/camera/infra2/image_rect_raw, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono8, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/infra2/image_rect_raw, type: sensor_msgs/msg/Image, resolution_wxh: 544x640, encoding: mono8, nominal_hz: 30, unit: null, frame_id: camera_camera_right,
                 mean_rate_hz: {A: 30.0, B: 30.0}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: V, nominal: V, rate: V, unit: '-'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF, API], encoding: [MF], nominal: [API, M1, M2, D0, D1], rate: [M1, M2], unit: []}
      deviations: [DEV-NAMESPACE, DEV-RES-ORDER]
    depth:
      official_v1_2_0: {topic: /insight/depth, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono16, rate_hz: 15, unit: mm}
      official_v1_2_1: {topic: /camera/depth/image_rect_raw, type: sensor_msgs/msg/Image, resolution: 640x544, encoding: mono16, rate_hz: 15, unit: mm}
      measured: {topic: /camera/camera/depth/image_rect_raw, type: sensor_msgs/msg/Image, resolution_wxh: 544x640, encoding: mono16, nominal_hz: 15, unit: mm, frame_id: camera_camera_depth,
                 mean_rate_hz: {A: 13.1, B: 13.077}, loss_pct: {A: 12.654, B: 12.828}}
      # nominal 15 Hz: only the vendor guides say so; the measured median frame interval (66.7 ms) is consistent with a 15 Hz grid (O). unit mm: vendor guides only (?)
      status:  {topic: V, type: V, resolution: V, encoding: V, nominal: O, rate: V, unit: '?'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF], encoding: [MF], nominal: [M1, M2, D0, D1], rate: [M1, M2], unit: [D0, D1]}
      deviations: [DEV-NAMESPACE, DEV-RES-ORDER, DEV-DEPTH-RATE, DEV-DEPTH-UNIT]
    imu:
      official_v1_2_0: {topic: /insight/imu, type: sensor_msgs/msg/Imu, resolution: null, encoding: null, rate_hz: 400, unit: null}
      official_v1_2_1: {topic: /camera/camera/imu, type: sensor_msgs/msg/Imu, resolution: null, encoding: null, rate_hz: 400, unit: null}
      measured: {topic: /camera/camera/imu, type: sensor_msgs/msg/Imu, resolution_wxh: null, encoding: null, nominal_hz: 400, unit: 'accel m/s^2, gyro rad/s', frame_id: camera_camera_imu_optical,
                 mean_rate_hz: {A: 399.511, B: 400.0}, loss_pct: {A: 0.122, B: 0.0}}
      # accel m/s^2 is observed (|a| = 9.78 at rest) but the guides give no IMU unit and the gyro unit is unconfirmed => '?'
      status:  {topic: V, type: V, resolution: '-', encoding: '-', nominal: V, rate: V, unit: '?'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [], encoding: [], nominal: [M1, M2, D0, D1], rate: [M1, M2], unit: [MF]}
      deviations: [DEV-NAMESPACE]
    vio:
      official_v1_2_0: {topic: /insight/vio_pose, type: geometry_msgs/msg/PoseStamped, resolution: null, encoding: null, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /insight/vio_pose, type: geometry_msgs/msg/PoseStamped, resolution: null, encoding: null, rate_hz: 15, unit: null}
      measured: {topic: /camera/camera/vio_100hz, type: geometry_msgs/msg/PoseStamped, resolution_wxh: null, encoding: null, nominal_hz: 100, unit: 'position m, orientation quaternion', frame_id: world,
                 mean_rate_hz: {A: 99.944, B: 99.9}, loss_pct: {A: 0.056, B: 0.1}}
      # nominal 100 Hz is read from the topic name + 10 ms median interval only (O); metres/quaternion are REP-103 assumptions, scale never checked in motion (?)
      status:  {topic: V, type: V, resolution: '-', encoding: '-', nominal: O, rate: V, unit: '?'}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [], encoding: [], nominal: [TL, M1, M2], rate: [M1, M2], unit: [D0, D1]}
      deviations: [DEV-NAMESPACE, DEV-VIO-RATE, DEV-VIO-SEMANTICS]
    rgb_info:
      official_v1_2_0: {topic: /insight/camera_rgb_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/color/camera_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/color/camera_info, type: sensor_msgs/msg/CameraInfo, resolution_wxh: 1088x1920, encoding: null, nominal_hz: 30, unit: 'pixels (K,P)', frame_id: camera_camera_rgb,
                 mean_rate_hz: {A: 30.019, B: 30.019}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: '-', nominal: V, rate: V, unit: O}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF], encoding: [], nominal: [M1, M2, D0, D1], rate: [M1, M2], unit: [MF]}
      deviations: [DEV-NAMESPACE]
    stereo_left_info:
      official_v1_2_0: {topic: /insight/camera_left_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/infra1/camera_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/infra1/camera_info, type: sensor_msgs/msg/CameraInfo, resolution_wxh: 544x640, encoding: null, nominal_hz: 30, unit: 'pixels (K,P)', frame_id: camera_camera_left,
                 mean_rate_hz: {A: 30.0, B: 30.0}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: '-', nominal: V, rate: V, unit: O}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF], encoding: [], nominal: [M1, M2, D0, D1], rate: [M1, M2], unit: [MF]}
      deviations: [DEV-NAMESPACE]
    stereo_right_info:
      official_v1_2_0: {topic: /insight/camera_right_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      official_v1_2_1: {topic: /camera/infra2/camera_info, type: sensor_msgs/msg/CameraInfo, resolution: null, encoding: null, rate_hz: 30, unit: null}
      measured: {topic: /camera/camera/infra2/camera_info, type: sensor_msgs/msg/CameraInfo, resolution_wxh: 544x640, encoding: null, nominal_hz: 30, unit: 'pixels (K,P); P[0,3] = -fx*baseline (px*m)', frame_id: camera_camera_right,
                 mean_rate_hz: {A: 30.0, B: 30.0}, loss_pct: {A: 0.0, B: 0.0}}
      status:  {topic: V, type: V, resolution: V, encoding: '-', nominal: V, rate: V, unit: O}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], resolution: [MF], encoding: [], nominal: [M1, M2, D0, D1], rate: [M1, M2], unit: [MF]}
      deviations: [DEV-NAMESPACE]
    depth_info:
      official_v1_2_0: null          # not listed in v1.2.0
      official_v1_2_1: null          # not listed in v1.2.1
      measured: null                 # topic does not exist on fw 2.1.5
      status:  {topic: O, type: '-', resolution: '-', encoding: '-', nominal: '-', rate: '-', unit: '-'}
      sources: {topic: [TL], type: [], resolution: [], encoding: [], nominal: [], rate: [], unit: []}
      deviations: [DEV-DEPTH-INFO]
  global_topics:
    tf_static:
      official_v1_2_0: {topic: /static_tf, type: tf2_msgs/msg/TFMessage, rate_hz: null, description: 'IMU-Camera extrinsics'}
      official_v1_2_1: {topic: /tf_static, type: tf2_msgs/msg/TFMessage, rate_hz: null, description: 'IMU-Camera extrinsics'}
      measured: {topic: /tf_static, type: tf2_msgs/msg/TFMessage, nominal_hz: null, mean_rate_hz: null, qos: 'RELIABLE, TRANSIENT_LOCAL, keep 1', messages_per_run: 1, edges: 5}
      status:  {topic: V, type: V, rate: '-', unit: O}
      sources: {topic: [TL, M1, M2], type: [TL, M1, M2], rate: [], unit: [MF]}
      deviations: [DEV-STATIC-TF-NAME]
    static_tf:
      official_v1_2_0: {topic: /static_tf, type: tf2_msgs/msg/TFMessage}
      official_v1_2_1: null
      measured: null                 # NOT published on fw 2.1.5
      status:  {topic: O}
      sources: {topic: [TL]}
      deviations: [DEV-STATIC-TF-NAME]
    tf:
      official_v1_2_0: null
      official_v1_2_1: null
      measured: null                 # never published
      status:  {topic: O}
      sources: {topic: [TL, M1, M2]}
      deviations: []
  extras_measured_only:             # published by fw 2.1.5, absent from both guides
