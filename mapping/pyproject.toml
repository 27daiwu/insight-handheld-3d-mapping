[project]
name = "insight-mapping"
version = "0.1.0"
description = "Offline 3D reconstruction from Insight 9 Sessions (VIO + RTAB-Map + Open3D)"
requires-python = ">=3.10"
dependencies = ["numpy<2", "scipy", "opencv-python-headless>=4.5", "open3d>=0.18", "pyyaml", "jsonschema"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
insight-mapping = "insight_mapping.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long runtime", "ros: needs ROS 2 Humble python env sourced", "tum: needs the TUM fr1/desk public dataset"]

[tool.setuptools.packages.find]
include = ["insight_mapping*"]
